kind = "web"
previewPath = "/"
title = "CUCCI"
version = "1.0.0"
id = "artifacts/cucci"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18378

[services.development]
run = "pnpm --filter @workspace/cucci run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cucci", "run", "build" ]
publicDir = "artifacts/cucci/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18378"
BASE_PATH = "/"
