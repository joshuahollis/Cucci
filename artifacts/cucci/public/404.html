<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CUCCI®</title>
    <script type="text/javascript">
      // GitHub Pages SPA fallback (rafgraph/spa-github-pages, MIT).
      // Serves this file for missing paths, then redirects into index.html
      // with the path/query encoded so the client router can restore them.
      // pathSegmentsToKeep = 0 for apex custom domain (ilovecucci.com) with BASE_PATH=/.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search
            ? "&" + l.search.slice(1).replace(/&/g, "~and~")
            : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
