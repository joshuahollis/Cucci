[build]
  command = "PORT=8080 BASE_PATH=/ pnpm --filter @workspace/cucci run build"
  publish = "artifacts/cucci/dist/public"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "11.0.8"
  # pnpm lifecycle scripts on Netlify often omit npm_config_user_agent=pnpm/*
  npm_config_user_agent = "pnpm/11.0.8"
  PNPM_HOME = "/opt/buildhome/.local/share/pnpm"
  CI = "true"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
